on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      sfdx:
        type: boolean
        default: false
      sdkVersion:
        type: string
        default: ""
        description: "SDK branch/tag to generate and test (leave empty for dev)"
      is_pr:
        type: boolean
        default: false
    secrets:
      ANDROID_UI_TEST_CONFIG:
        required: true
      GCLOUD_SERVICE_KEY:
        required: true

permissions:
  contents: read

jobs:
  test-android:
    name: ${{ inputs.app }}
    runs-on: forcedotcom-ubuntu  # forks: use ubuntu-latest (org-scoped runner)
    env:
      GCLOUD_RESULTS_DIR: "UITest-${{ inputs.app }}-sfdx-${{ inputs.sfdx }}-build-${{ github.run_number }}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ inputs.is_pr }}
        with:
          persist-credentials: false
          # We need a sufficient depth or Danger will occasionally run into issues checking which files were modified.
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        if: ${{ ! inputs.is_pr }}
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: "8.14.3"
          add-job-summary: on-failure
          add-job-summary-as-pr-comment: on-failure
      - name: Install Dependencies
        env:
          ANDROID_UI_TEST_CONFIG: ${{ secrets.ANDROID_UI_TEST_CONFIG }}
        run: |
          ./install.sh
          echo $ANDROID_UI_TEST_CONFIG > ./shared/test/android/ui_test_config.json
      - uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed'  # v2.1.13
        if: success() || failure()
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'
      - uses: 'google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f'  # v2.2.1
        if: success() || failure()
      - name: Build ${{ inputs.app }} and Test Login
        env:
          APP: ${{ inputs.app }}
          SFDX_INPUT: ${{ inputs.sfdx }}
          SDK_VERSION_INPUT: ${{ inputs.sdkVersion }}
        run: |
          SFDX_FLAG=""
          if [ "$SFDX_INPUT" = "true" ]; then
            SFDX_FLAG="--sf"
          fi

          SDK_VERSION_FLAG=""
          if [ -n "$SDK_VERSION_INPUT" ]; then
            SDK_VERSION_FLAG="--sdkVersion=$SDK_VERSION_INPUT"
          fi

          ./test android "$APP" $SFDX_FLAG $SDK_VERSION_FLAG
      - name: Copy Test Results
        continue-on-error: true
        if: success() || failure()
        env:
          APP: ${{ inputs.app }}
        run: |
          mkdir -p firebase_results
          BUCKET="gs://test-lab-w87i9sz6q175u-kwp8ium6js0zw"
          BUCKET_PATH="${BUCKET}/${GCLOUD_RESULTS_DIR}"

          copy_results_by_api_level() {
            local BUCKET_PATH=$1
            local OUTPUT_PREFIX=$2

            for RESULT_FILE in $(gsutil ls "${BUCKET_PATH}/*/test_result_1.xml" 2>/dev/null | grep -v "rerun"); do
              DEVICE_DIR=$(echo "${RESULT_FILE}" | sed 's|.*/\([^/]*\)/test_result_1.xml|\1|')
              API_LEVEL=$(echo "${DEVICE_DIR}" | sed 's/.*-\([0-9]*\)-.*/\1/')
              gsutil cp "${RESULT_FILE}" "firebase_results/${OUTPUT_PREFIX}_api_${API_LEVEL}_test_result.xml"
            done

            for RESULT_FILE in $(gsutil ls "${BUCKET_PATH}/*/test_result_1.xml" 2>/dev/null | grep "rerun"); do
              DEVICE_DIR=$(echo "${RESULT_FILE}" | sed 's|.*/\([^/]*\)/test_result_1.xml|\1|')
              API_LEVEL=$(echo "${DEVICE_DIR}" | sed 's/.*-\([0-9]*\)-.*/\1/')
              RERUN_TMP="firebase_results/${OUTPUT_PREFIX}_api_${API_LEVEL}_rerun_tmp.xml"
              ORIG_FILE="firebase_results/${OUTPUT_PREFIX}_api_${API_LEVEL}_test_result.xml"
              gsutil cp "${RESULT_FILE}" "${RERUN_TMP}"
              python3 - "${ORIG_FILE}" "${RERUN_TMP}" "${ORIG_FILE}" << 'PYEOF'
          import sys, xml.etree.ElementTree as ET
          orig = ET.parse(sys.argv[1])
          rerun = ET.parse(sys.argv[2])
          def suite(t):
            r = t.getroot()
            return r if r.tag == 'testsuite' else r.find('testsuite')
          os_el, rs_el = suite(orig), suite(rerun)
          failed_keys = set()
          for tc in os_el.findall('testcase'):
            if tc.find('failure') is not None or tc.find('error') is not None:
              failed_keys.add(f"{tc.get('name','')}|{tc.get('classname','')}|{tc.get('file','')}")
          added = 0
          for tc in rs_el.findall('testcase'):
            if f"{tc.get('name','')}|{tc.get('classname','')}|{tc.get('file','')}" in failed_keys:
              os_el.append(tc)
              added += 1
          os_el.set('tests', str(int(os_el.get('tests','0')) + added))
          with open(sys.argv[3], 'w') as f:
            f.write(ET.tostring(orig.getroot(), encoding='unicode'))
          PYEOF
              rm "${RERUN_TMP}"
            done
          }

          if gsutil ls "${BUCKET_PATH}" > /dev/null 2>&1; then
            copy_results_by_api_level "${BUCKET_PATH}" "$APP"
          fi
      - name: Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        if: success() || failure()
        with:
          check_name: ${{ inputs.app }} Test Results
          job_name: ${{ inputs.app }} Test Results
          require_tests: true
          check_retries: true
          flaky_summary: true
          group_reports: false
          include_passed: true
          skip_annotations: true
          skip_success_summary: false
          include_empty_in_summary: false
          simplified_summary: true
          report_paths: 'firebase_results/**.xml'
      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: success() || failure()
        with:
          name: test-results-${{ inputs.app }}-android-sfdx-${{ inputs.sfdx }}
          path: firebase_results/**.xml
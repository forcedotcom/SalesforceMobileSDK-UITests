name: Build and Test All Apps

on:
  schedule:
    - cron: "0 6 * * 0"  # cron is UTC, this translates to 10 PM PST Saturday.
  # This lets us trigger the workflow from a browser.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-base:
    permissions:
      contents: read
    name: ${{ matrix.app }} Android
    strategy:
      fail-fast: false
      matrix:
        app:  [native_kotlin, MobileSyncExplorerKotlin, hybrid_local, hybrid_remote, MobileSyncExplorerReactNative, complex_hybrid_accounteditor, complex_hybrid_mobilesyncexplorer]
    uses: ./.github/workflows/android-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
    secrets:
      ANDROID_UI_TEST_CONFIG: ${{ secrets.ANDROID_UI_TEST_CONFIG }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}

  android-sfdx:
    permissions:
      contents: read
    name: ${{ matrix.app }} Android sfdx
    strategy:
      fail-fast: false
      matrix:
        app:  [native_kotlin, hybrid_local, MobileSyncExplorerReactNative]
    uses: ./.github/workflows/android-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      sfdx: true
    secrets:
      ANDROID_UI_TEST_CONFIG: ${{ secrets.ANDROID_UI_TEST_CONFIG }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}

  android-hostless-redirect:
    permissions:
      contents: read
    # Exercises the genuinely-hostless callback (ecaadvancedopaque:///success/done ->
    # android:host="") so the generated redirect <intent-filter> is verified to DELIVER
    # the browser round-trip for the empty-authority shape (W-23294087). Covers the three
    # distinct manifest-generation paths: native, hybrid injection, and React Native.
    name: ${{ matrix.app }} Android hostless redirect
    strategy:
      fail-fast: false
      matrix:
        app: [native_kotlin, hybrid_local, MobileSyncExplorerReactNative]
    uses: ./.github/workflows/android-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      appConfig: eca_opaque_hostless
    secrets:
      ANDROID_UI_TEST_CONFIG: ${{ secrets.ANDROID_UI_TEST_CONFIG }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}

  ios-base-legacy:
    permissions:
      contents: read
    name: ${{ matrix.app }} iOS 18
    strategy:
      fail-fast: false
      matrix:
        app:  [native_swift, MobileSyncExplorerSwift, hybrid_local, hybrid_remote, MobileSyncExplorerReactNative, complex_hybrid_accounteditor, complex_hybrid_mobilesyncexplorer]
    uses: ./.github/workflows/ios-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      ios: "18"
      runner: macos-15
    secrets:
      IOS_UI_TEST_CONFIG: ${{ secrets.IOS_UI_TEST_CONFIG }}

  ios-base:
    permissions:
      contents: read
    name: ${{ matrix.app }} iOS 26
    strategy:
      fail-fast: false
      matrix:
        app:  [native_swift, MobileSyncExplorerSwift, hybrid_local, hybrid_remote, MobileSyncExplorerReactNative, complex_hybrid_accounteditor, complex_hybrid_mobilesyncexplorer]
    uses: ./.github/workflows/ios-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      ios: "26"
    secrets:
      IOS_UI_TEST_CONFIG: ${{ secrets.IOS_UI_TEST_CONFIG }}

  ios-sfdx:
    permissions:
      contents: read
    name: ${{ matrix.app }} iOS sfdx
    strategy:
      fail-fast: false
      matrix:
        app: [native_swift, hybrid_local, MobileSyncExplorerReactNative]
    uses: ./.github/workflows/ios-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      sfdx: true
    secrets:
      IOS_UI_TEST_CONFIG: ${{ secrets.IOS_UI_TEST_CONFIG }}

  android-upgrade:
    permissions:
      contents: read
    # Run upgrade tests after so standard login's don't revoke upgrade refresh
    # tokens mid-execution by hitting the user session limit.
    needs: [android-base, android-sfdx]
    if: ${{ !cancelled() }}
    name: ${{ matrix.app }} Android Upgrade from ${{ matrix.upgradeFrom }}
    strategy:
      fail-fast: false
      matrix:
        app: [MobileSyncExplorerKotlin, hybrid_local, MobileSyncExplorerReactNative]
        upgradeFrom: ["v12.2.0", "v13.2.0"]
        exclude:
          - app: MobileSyncExplorerReactNative
            upgradeFrom: "v12.2.0"
          - app: hybrid_local
            upgradeFrom: "v12.2.0"
    uses: ./.github/workflows/android-upgrade-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      upgradeFrom: ${{ matrix.upgradeFrom }}
    secrets:
      ANDROID_UI_TEST_CONFIG: ${{ secrets.ANDROID_UI_TEST_CONFIG }}

  ios-upgrade:
    permissions:
      contents: read
    # If macos runner concurrency limit increases run these after standard login like Android.
    name: ${{ matrix.app }} iOS Upgrade from ${{ matrix.upgradeFrom }}
    strategy:
      fail-fast: false
      matrix:
        app: [MobileSyncExplorerSwift, hybrid_local, MobileSyncExplorerReactNative]
        upgradeFrom: ["v12.2.0", "v13.2.0"]
        exclude:
          - app: MobileSyncExplorerReactNative
            upgradeFrom: "v12.2.0"
    uses: ./.github/workflows/ios-reusable-workflow.yaml
    with:
      app: ${{ matrix.app }}
      upgradeFrom: ${{ matrix.upgradeFrom }}
    secrets:
      IOS_UI_TEST_CONFIG: ${{ secrets.IOS_UI_TEST_CONFIG }}
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      upgradeFrom:
        type: string
        required: true
        description: "SDK version/branch/tag to upgrade FROM"
      api-level:
        type: string
        default: "35"
        description: "Android API level for the emulator"
    secrets:
      ANDROID_UI_TEST_CONFIG:
        required: true

permissions:
  contents: read

jobs:
  test-android-upgrade:
    name: ${{ inputs.app }} API ${{ inputs.api-level }} Upgrade from ${{ inputs.upgradeFrom }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: "8.14.3"
          add-job-summary: on-failure
      - name: Install Dependencies
        env:
          ANDROID_UI_TEST_CONFIG: ${{ secrets.ANDROID_UI_TEST_CONFIG }}
        run: |
          ./install.sh
          echo $ANDROID_UI_TEST_CONFIG > ./shared/test/android/ui_test_config.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ inputs.api-level }}-${{ runner.os }}
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a  # v2.37.0
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none -memory 2048 -no-snapshot-save
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."
      - name: Build ${{ inputs.app }}, Login, Upgrade from ${{ inputs.upgradeFrom }} and Test
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a  # v2.37.0
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -no-snapshot-save
          disable-animations: true
          script: ./test android ${{ inputs.app }} --upgrade=${{ inputs.upgradeFrom }}
      - name: Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d  # v6.4.1
        if: success() || failure()
        with:
          check_name: ${{ inputs.app }} API ${{ inputs.api-level }} Upgrade Test Results
          job_name: ${{ inputs.app }} API ${{ inputs.api-level }} Upgrade Test Results
          require_tests: true
          check_retries: true
          flaky_summary: true
          group_reports: false
          include_passed: true
          skip_annotations: true
          skip_success_summary: false
          include_empty_in_summary: false
          simplified_summary: true
          report_paths: 'Android/app/build/outputs/androidTest-results/**/*.xml'
      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: success() || failure()
        with:
          name: test-results-${{ inputs.app }}-android-api-${{ inputs.api-level }}-upgrade-${{ inputs.upgradeFrom }}
          path: Android/app/build/outputs/androidTest-results/
